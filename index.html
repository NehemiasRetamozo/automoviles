<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Experto Automóviles</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:480px;
  background:#f8fbff;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}

.header{
  background:linear-gradient(135deg,#111827,#1e3a8a);
  color:white;
  padding:26px 22px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:8px 0 0;
  opacity:.85;
}

.status{
  margin:18px;
  padding:12px;
  border-radius:16px;
  background:#dbeafe;
  color:#1d4ed8;
  font-weight:bold;
  text-align:center;
}

.card{
  margin:18px;
  padding:24px;
  background:white;
  border-radius:24px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.label{
  color:#64748b;
  font-size:15px;
  margin-bottom:10px;
}

.question{
  font-size:32px;
  font-weight:800;
  color:#0f172a;
  line-height:1.15;
}

.options{
  display:grid;
  gap:14px;
  margin-top:22px;
}

.btn{
  border:none;
  padding:18px;
  border-radius:18px;
  font-size:22px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:scale(1.03);
}

.si{
  background:#dcfce7;
  color:#166534;
  border:2px solid #16a34a;
}

.no{
  background:#fee2e2;
  color:#991b1b;
  border:2px solid #dc2626;
}

.opcion{
  background:#e0f2fe;
  color:#075985;
  border:2px solid #0284c7;
}

.voice-box{
  margin-top:22px;
  text-align:center;
  background:#f1f5f9;
  padding:20px;
  border-radius:22px;
}

.mic{
  width:105px;
  height:105px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#2563eb,#0f766e);
  color:white;
  font-size:45px;
  cursor:pointer;
  box-shadow:0 12px 25px rgba(37,99,235,.35);
}

.mic.listen{
  background:linear-gradient(135deg,#dc2626,#991b1b);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

.chain{
  margin:18px;
  background:#ffffff;
  border-radius:20px;
  padding:18px;
  font-size:15px;
  color:#334155;
  display:none;
}

.chain b{
  color:#0f172a;
}

.result{
  margin:18px;
  padding:24px;
  border-radius:24px;
  text-align:center;
  background:#fff1f2;
  border:3px solid #be123c;
  color:#9f1239;
}

.result.ok{
  background:#ecfdf5;
  border-color:#16a34a;
  color:#166534;
}

.result h2{
  font-size:31px;
  margin:8px 0;
}

.result p{
  font-size:22px;
  font-weight:700;
}

.new{
  margin:0 18px 22px;
  width:calc(100% - 36px);
  background:#111827;
  color:white;
}

@media(max-width:420px){
  body{padding:0;background:#f8fbff}
  .app{min-height:100vh;border-radius:0}
  .question{font-size:30px}
  .header h1{font-size:22px}
}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <h1>🚗 Sistema Experto</h1>
    <p>Diagnóstico de fallas de automóviles</p>
  </div>

  <div class="status" id="status">Sistema listo</div>

  <div class="card">
    <div class="label">El sistema pregunta:</div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>

    <div class="voice-box">
      <p>Responde con botones o por voz</p>
      <button class="mic" id="mic" onclick="listen()">🎤</button>
    </div>
  </div>

  <div class="chain" id="chain"></div>
  <div id="result"></div>
</div>

<script>
const rules = {
  inicio:{desc:"determina-estado-motor",pregunta:"¿El motor arranca?",opciones:["si","no"],si:"funciona",no:"gira"},
  funciona:{desc:"determina-funciona-normalmente",pregunta:"¿El motor funciona normalmente?",opciones:["si","no"],si:"normal",no:"lento"},
  lento:{desc:"determina-lentitud",pregunta:"¿El motor está lento?",opciones:["si","no"],si:"motor_lento",no:"golpea"},
  golpea:{desc:"determina-golpeo",pregunta:"¿El motor golpea?",opciones:["si","no"],si:"motor_golpea",no:"falla"},
  falla:{desc:"determina-motor-falla",pregunta:"¿Tiene fallas de encendido?",opciones:["si","no"],si:"falla_encendido",no:"rendimiento"},
  rendimiento:{desc:"determina-bajo-rendimiento",pregunta:"¿Tiene bajo rendimiento?",opciones:["si","no"],si:"bujia1",no:"mecanico"},
  bujia1:{desc:"determina-superficie-bujia",pregunta:"¿Cuál es el estado de la bujía?",opciones:["normal","quemada","contaminada"],normal:"mecanico",quemada:"bujia_quemada",contaminada:"bujia_contaminada"},
  gira:{desc:"determina-estado-rotacion",pregunta:"¿El motor de arranque gira?",opciones:["si","no"],si:"gasolina",no:"bateria"},
  gasolina:{desc:"determina-nivel-gasolina",pregunta:"¿El tanque tiene gasolina?",opciones:["si","no"],si:"bujia2",no:"sin_gasolina"},
  bujia2:{desc:"determina-superficie-bujia",pregunta:"¿Cuál es el estado de la bujía?",opciones:["normal","quemada","contaminada"],normal:"conductividad",quemada:"bujia_quemada",contaminada:"bujia_contaminada"},
  conductividad:{desc:"determina-prueba-conductividad",pregunta:"¿La prueba de conductividad es positiva?",opciones:["si","no"],si:"cable",no:"bobina"},
  bateria:{desc:"determina-estado-bateria",pregunta:"¿La batería está cargada?",opciones:["si","no"],si:"conductividad",no:"bateria_muerta"}
};

const diagnostics = {
  normal:["Sin falla detectada","El vehículo funciona con normalidad.","ok"],
  motor_lento:["Motor lento","Limpiar la vía del combustible.","falla"],
  motor_golpea:["Motor golpea","Realizar ajuste de temporización.","falla"],
  falla_encendido:["Falla de encendido","Ajustar la brecha de puntos.","falla"],
  mecanico:["Falla no identificada","Llevar el vehículo a una mecánica especializada.","falla"],
  bujia_quemada:["Bujía quemada","Reemplace las bujías.","falla"],
  bujia_contaminada:["Bujía contaminada","Limpie las bujías.","falla"],
  sin_gasolina:["Tanque sin gasolina","Agregue gasolina al tanque.","falla"],
  cable:["Cable del distribuidor defectuoso","Reparar el cable del distribuidor.","falla"],
  bobina:["Bobina de encendido defectuosa","Reemplace la bobina de encendido.","falla"],
  bateria_muerta:["Batería descargada","Cargue o reemplace la batería.","falla"]
};

let node="inicio";
let history=[];

function speak(text){
  speechSynthesis.cancel();
  let voice=new SpeechSynthesisUtterance(text);
  voice.lang="es-ES";
  voice.rate=.95;
  speechSynthesis.speak(voice);
}

function showQuestion(){
  const r=rules[node];
  document.getElementById("status").innerText=r.desc;
  document.getElementById("question").innerText=r.pregunta;

  let html="";
  r.opciones.forEach(op=>{
    let cls=op==="si"?"si":op==="no"?"no":"opcion";
    html+=`<button class="btn ${cls}" onclick="answer('${op}')">${op.toUpperCase()}</button>`;
  });

  document.getElementById("options").innerHTML=html;
  speak(r.pregunta);
}

function answer(resp){
  const r=rules[node];
  history.push(`${r.desc} → ${resp}`);
  node=r[resp];

  updateChain();

  if(diagnostics[node]){
    showResult();
  }else{
    showQuestion();
  }
}

function updateChain(){
  const box=document.getElementById("chain");
  box.style.display="block";
  let html="<b>CADENA DE INFERENCIA</b><br><br>";
  history.forEach((h,i)=>{
    html+=`Paso ${i+1}: ${h}<br>`;
  });
  box.innerHTML=html;
}

function showResult(){
  const d=diagnostics[node];
  document.getElementById("options").innerHTML="";
  document.getElementById("question").innerText="Diagnóstico completado";
  document.getElementById("status").innerText="Resultado final";

  document.getElementById("result").innerHTML=`
    <div class="result ${d[2]==='ok'?'ok':''}">
      <h2>${d[0]}</h2>
      <p>${d[1]}</p>
    </div>
    <button class="btn new" onclick="restart()">🔄 Nuevo diagnóstico</button>
  `;

  speak("Diagnóstico: "+d[0]+". Recomendación: "+d[1]);
}

function restart(){
  node="inicio";
  history=[];
  document.getElementById("chain").style.display="none";
  document.getElementById("result").innerHTML="";
  showQuestion();
}

function listen(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Tu navegador no permite voz. Usa Google Chrome.");
    return;
  }

  const mic=document.getElementById("mic");
  const rec=new SpeechRecognition();
  rec.lang="es-ES";
  rec.start();

  mic.classList.add("listen");
  document.getElementById("status").innerText="Escuchando...";

  rec.onresult=function(e){
    mic.classList.remove("listen");
    let text=e.results[0][0].transcript.toLowerCase();

    if(text.includes("sí")||text.includes("si")) answer("si");
    else if(text.includes("no")) answer("no");
    else if(text.includes("normal")) answer("normal");
    else if(text.includes("quemada")) answer("quemada");
    else if(text.includes("contaminada")) answer("contaminada");
    else{
      speak("No reconocí tu respuesta. Intenta nuevamente.");
      alert("No reconocí: "+text);
      showQuestion();
    }
  };

  rec.onerror=function(){
    mic.classList.remove("listen");
    speak("No pude escuchar. Intenta otra vez.");
    showQuestion();
  };
}

showQuestion();
</script>

</body>
</html>
